# Local development services. Start: `docker compose up -d`
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: yekkola
      POSTGRES_PASSWORD: yekkola
      POSTGRES_DB: yekkola
    ports:
      - "55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yekkola"]
      interval: 5s
      retries: 10

  valkey:
    image: valkey/valkey:8-alpine
    ports:
      - "6379:6379"
    volumes:
      - valkey-data:/data

  meilisearch:
    image: getmeili/meilisearch:v1.15
    environment:
      MEILI_MASTER_KEY: yekkola-local-master-key
      MEILI_ENV: development
    ports:
      - "7700:7700"
    volumes:
      - meili-data:/meili_data

volumes:
  postgres-data:
  valkey-data:
  meili-data:
